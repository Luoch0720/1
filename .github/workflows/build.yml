name: Build TelegramVoiceNoteTweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make clang perl \
            git curl rsync python3 \
            libxml2-dev libssl-dev zlib1g-dev \
            dpkg-dev fakeroot

      - name: Clone Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iOS toolchain (clang + ldid)
        run: |
          cd "$THEOS/toolchain"
          curl -fL -o tc.tar.xz \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.xz"
          tar -xf tc.tar.xz
          rm tc.tar.xz
          ls -la "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          # 用 sparse checkout 只拿需要的 SDK，避免 clone 整个大仓库
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls -la "$THEOS/sdks/"

      - name: Build rootless package (Dopamine / modern jailbreak)
        run: |
          cd "${{ github.workspace }}"
          make clean THEOS_PACKAGE_SCHEME=rootless || true
          make package THEOS_PACKAGE_SCHEME=rootless
          echo "=== rootless artifacts ==="
          ls -la packages/

      - name: Build rootful package (legacy jailbreak)
        run: |
          cd "${{ github.workspace }}"
          make clean || true
          make package
          echo "=== rootful artifacts ==="
          ls -la packages/

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelegramVoiceNoteTweak-debs
          path: packages/*.deb
          retention-days: 30

      - name: Package info
        run: |
          cd "${{ github.workspace }}/packages"
          for f in *.deb; do
            echo "=== $f ==="
            dpkg-deb -I "$f" 2>/dev/null || echo "(cannot read)"
            echo ""
          done
