name: Build TelegramVoiceNoteTweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make clang perl \
            git curl rsync python3 \
            libxml2-dev libssl-dev zlib1g-dev \
            dpkg-dev fakeroot xz-utils lzma

      - name: Clone Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iOS toolchain (clang + ldid)
        run: |
          cd "$THEOS/toolchain"
          curl -fL -o tc.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma"
          tar --lzma -xf tc.tar.lzma
          rm tc.tar.lzma
          ls -la "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          # 用 sparse checkout 只拿需要的 SDK，避免 clone 整个大仓库
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls -la "$THEOS/sdks/"

      - name: Build rootless package (Dopamine / modern jailbreak)
        id: build_rootless
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}"
          make clean THEOS_PACKAGE_SCHEME=rootless || true
          make package THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build_rootless.log
          echo "=== exit code: $? ==="
          ls -la packages/ 2>/dev/null || echo "no packages dir"

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_rootless.log
            packages/
          retention-days: 7

      - name: Check build result
        run: |
          cd "${{ github.workspace }}"
          if ls packages/*.deb 1>/dev/null 2>&1; then
            echo "BUILD SUCCESS"
            ls -la packages/
          else
            echo "BUILD FAILED — last 80 lines of log:"
            tail -80 build_rootless.log
            exit 1
          fi
