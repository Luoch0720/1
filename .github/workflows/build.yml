name: Build TelegramVoiceNoteTweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make clang perl \
            git curl rsync python3 \
            libxml2-dev libssl-dev zlib1g-dev \
            dpkg-dev fakeroot xz-utils lzma

      - name: Clone Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iOS toolchain (clang + ldid)
        continue-on-error: true
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone"
          cd /tmp
          echo "=== Downloading toolchain ==="
          curl -fL -o tc.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma"
          echo "Downloaded size: $(ls -la tc.tar.lzma | awk '{print $5}')"
          echo "=== Extracting ==="
          mkdir -p tc_extract
          # 用 lzma 解压再 tar，避免 tar --lzma 兼容问题
          lzma -d -c tc.tar.lzma | tar -xf - -C tc_extract 2>&1 || tar --lzma -xf tc.tar.lzma -C tc_extract 2>&1
          echo "=== Top-level structure ==="
          ls -la tc_extract/
          echo "=== Full structure (max depth 4) ==="
          find tc_extract -maxdepth 4 | head -80
          echo "=== Looking for clang ==="
          find tc_extract -iname "*clang*" -type f 2>/dev/null | head -20
          echo "=== Looking for bin dirs ==="
          find tc_extract -maxdepth 5 -name "bin" -type d 2>/dev/null
          # 找到任何 clang 可执行文件
          CLANG_PATH=$(find tc_extract -iname "clang*" -type f -executable 2>/dev/null | grep -v "\.so" | head -1)
          if [ -z "$CLANG_PATH" ]; then
            CLANG_PATH=$(find tc_extract -iname "clang" -type f 2>/dev/null | head -1)
          fi
          echo "CLANG_PATH=$CLANG_PATH"
          if [ -n "$CLANG_PATH" ]; then
            TOOLCHAIN_BIN=$(dirname "$CLANG_PATH")
            TOOLCHAIN_ROOT=$(dirname "$TOOLCHAIN_BIN")
            echo "TOOLCHAIN_ROOT=$TOOLCHAIN_ROOT"
            echo "Copying toolchain..."
            cp -rv "$TOOLCHAIN_ROOT"/* "$THEOS/toolchain/linux/iphone/" 2>&1 | tail -5
          else
            echo "ERROR: clang not found in extracted toolchain!"
          fi
          echo "=== Final verification ==="
          ls -la "$THEOS/toolchain/linux/iphone/bin/" 2>&1 | head -20
          if [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            "$THEOS/toolchain/linux/iphone/bin/clang" --version 2>&1 | head -3
          else
            echo "clang still not at expected path!"
          fi

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          # 用 sparse checkout 只拿需要的 SDK，避免 clone 整个大仓库
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls -la "$THEOS/sdks/"

      - name: Build rootless package (Dopamine / modern jailbreak)
        id: build_rootless
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}"
          echo "=== DEBUG INFO ==="
          echo "THEOS=$THEOS"
          echo "PWD=$(pwd)"
          echo "which make=$(which make)"
          echo "make version:"; make --version 2>&1 | head -2
          echo "SDKs:"; ls -la "$THEOS/sdks/" 2>&1
          echo "Toolchain:"; ls -la "$THEOS/toolchain/" 2>&1 | head -10
          echo "=== START BUILD ==="
          make clean THEOS_PACKAGE_SCHEME=rootless || true
          make package THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build_rootless.log
          echo "=== make exit code: $? ==="
          echo "=== packages dir ==="
          ls -la packages/ 2>/dev/null || echo "no packages dir"
          echo "=== obj dir ==="
          ls -la obj/ 2>/dev/null || echo "no obj dir"
          echo "=== FULL LOG ==="
          cat build_rootless.log

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_rootless.log
            packages/
          retention-days: 7

      - name: Check build result
        run: |
          cd "${{ github.workspace }}"
          if ls packages/*.deb 1>/dev/null 2>&1; then
            echo "BUILD SUCCESS"
            ls -la packages/
          else
            echo "BUILD FAILED"
            echo "=== Full log ==="
            cat build_rootless.log
            echo ""
            echo "=== Error lines ==="
            grep -i -E "error:|fatal:|cannot|not found|No rule|undefined|failed" build_rootless.log | head -20 || true
            # 输出到 annotation，方便 API 读取
            ERR=$(grep -i -E "error:|fatal:|cannot|not found|No rule|undefined|failed" build_rootless.log | head -5 | tr '\n' '|')
            echo "::error::BUILD FAILED: $ERR"
            exit 1
          fi
