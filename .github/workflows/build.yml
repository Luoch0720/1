name: Build TelegramVoiceNoteTweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make clang perl \
            git curl rsync python3 \
            libxml2-dev libssl-dev zlib1g-dev \
            dpkg-dev fakeroot xz-utils lzma

      - name: Clone Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iOS toolchain (clang + ldid)
        run: |
          mkdir -p "$THEOS/toolchain/linux"
          cd "$THEOS/toolchain/linux"
          curl -fL -o tc.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma"
          tar --lzma -xf tc.tar.lzma
          rm tc.tar.lzma
          echo "=== Extracted structure ==="
          ls -la
          # Theos expects toolchain at $THEOS/toolchain/linux/iphone/
          # sbingner toolchain extracts to a subdirectory, move it into place
          if [ -d "linux-ios-arm64e-clang-toolchain" ]; then
            mv linux-ios-arm64e-clang-toolchain iphone
          elif [ ! -d "iphone" ]; then
            # 如果解压后直接是 bin/lib 等目录，创建 iphone 并移入
            mkdir -p iphone
            find . -maxdepth 1 -mindepth 1 ! -name iphone -exec mv {} iphone/ \;
          fi
          echo "=== Final structure ==="
          ls -la iphone/
          echo "=== clang check ==="
          ls -la iphone/bin/clang 2>&1 || echo "clang not found at iphone/bin/clang"
          ls -la iphone/bin/ 2>&1 | head -20

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          # 用 sparse checkout 只拿需要的 SDK，避免 clone 整个大仓库
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls -la "$THEOS/sdks/"

      - name: Build rootless package (Dopamine / modern jailbreak)
        id: build_rootless
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}"
          echo "=== DEBUG INFO ==="
          echo "THEOS=$THEOS"
          echo "PWD=$(pwd)"
          echo "which make=$(which make)"
          echo "make version:"; make --version 2>&1 | head -2
          echo "SDKs:"; ls -la "$THEOS/sdks/" 2>&1
          echo "Toolchain:"; ls -la "$THEOS/toolchain/" 2>&1 | head -10
          echo "=== START BUILD ==="
          make clean THEOS_PACKAGE_SCHEME=rootless || true
          make package THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build_rootless.log
          echo "=== make exit code: $? ==="
          echo "=== packages dir ==="
          ls -la packages/ 2>/dev/null || echo "no packages dir"
          echo "=== obj dir ==="
          ls -la obj/ 2>/dev/null || echo "no obj dir"
          echo "=== FULL LOG ==="
          cat build_rootless.log

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_rootless.log
            packages/
          retention-days: 7

      - name: Check build result
        run: |
          cd "${{ github.workspace }}"
          if ls packages/*.deb 1>/dev/null 2>&1; then
            echo "BUILD SUCCESS"
            ls -la packages/
          else
            echo "BUILD FAILED"
            echo "=== Full log ==="
            cat build_rootless.log
            echo ""
            echo "=== Error lines ==="
            grep -i -E "error:|fatal:|cannot|not found|No rule|undefined|failed" build_rootless.log | head -20 || true
            # 输出到 annotation，方便 API 读取
            ERR=$(grep -i -E "error:|fatal:|cannot|not found|No rule|undefined|failed" build_rootless.log | head -5 | tr '\n' '|')
            echo "::error::BUILD FAILED: $ERR"
            exit 1
          fi
