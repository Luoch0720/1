name: Build TelegramVoiceNoteTweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      THEOS: ${{ github.workspace }}/theos
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            make \
            perl \
            libxml2 \
            libxml2-dev \
            libssl-dev \
            git \
            curl \
            zip \
            python3 \
            rsync
          sudo apt-get install -y gcc-multilib g++-multilib || true

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # 安装 Theos 依赖工具
          cd "$THEOS/toolchain"
          # 下载 Linux toolchain（含 clang + ldid）
          curl -L -o toolchain.tar.xz "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.xz"
          tar -xf toolchain.tar.xz
          rm toolchain.tar.xz
          ls -la "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          # 下载 iPhoneOS 16.5 SDK（兼容 iOS 15+ 编译目标）
          curl -L -o iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz"
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          ls -la "$THEOS/sdks"

      - name: Build package
        run: |
          cd "${{ github.workspace }}"
          # 清理可能的旧产物
          make clean THEOS_PACKAGE_SCHEME=rootless || true
          # 编译 rootless 包（Dopamine 等现代越狱）
          make package THEOS_PACKAGE_SCHEME=rootless
          # 同时编译 rootful 包作为备选
          make clean || true
          make package
          echo "=== Build artifacts ==="
          ls -la packages/

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelegramVoiceNoteTweak-debs
          path: packages/*.deb
          retention-days: 30

      - name: Show package info
        run: |
          cd "${{ github.workspace }}/packages"
          for f in *.deb; do
            echo "=== $f ==="
            dpkg-deb -I "$f" || true
            echo ""
          done
